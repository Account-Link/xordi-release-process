# Toy Example App - Cleanup Workflow
#
# Deletes existing CVMs for fresh deployment.
# Use this before major changes that require clean slate.

name: Cleanup Toy CVMs

on:
  workflow_dispatch:
    inputs:
      cvms:
        description: 'CVMs to delete (comma-separated)'
        required: true
        default: 'toy-example-prod7,toy-example-prod9,toy-example-staging'
      confirm:
        description: 'Type DELETE to confirm'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Phala CLI
        run: npm install -g phala

      - name: Delete CVMs
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          IFS=',' read -ra CVMS <<< "${{ github.event.inputs.cvms }}"
          for CVM in "${CVMS[@]}"; do
            CVM=$(echo "$CVM" | xargs)  # trim whitespace
            echo "Deleting CVM: $CVM"
            phala cvms delete "$CVM" --force 2>&1 || echo "Failed to delete $CVM (may not exist)"
          done

      - name: Summary
        run: |
          echo "## CVMs Deleted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following CVMs were targeted for deletion:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.inputs.cvms }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
